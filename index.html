<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boulders Stockholm</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Boulders Stockholm</h1>
    <p id="subtitle">Loading boulders…</p>
  </header>

  <main>
    <section class="controls">
      <input id="search" type="search" placeholder="Search route, crag or sector">

      <select id="crag">
        <option value="">All crags</option>
      </select>

      <select id="minGrade">
        <option value="">Min grade</option>
      </select>

      <select id="maxGrade">
        <option value="">Max grade</option>
      </select>

      <input id="minAscents" type="number" min="0" value="0" placeholder="Min ascents">

      <select id="minRating">
        <option value="0">Any rating</option>
        <option value="1">1.0+</option>
        <option value="1.5">1.5+</option>
        <option value="2">2.0+</option>
        <option value="2.25">2.25+</option>
        <option value="2.5">2.5+</option>
      </select>

      <select id="sort">
        <option value="ascents">Most ascents</option>
        <option value="rating">Highest rating</option>
        <option value="gradeAsc">Grade low → high</option>
        <option value="gradeDesc">Grade high → low</option>
        <option value="name">Name A–Z</option>
      </select>

      <button id="reset">Reset</button>
    </section>

    <section class="presets">
      <button data-preset="all" class="active">All</button>
      <button data-preset="popular">Popular</button>
      <button data-preset="rated">Highly rated</button>
    </section>

    <div class="results-header">
      <strong id="count"></strong>
    </div>

    <section id="list" class="list"></section>
    <button id="more" class="more" hidden>Show more</button>
  </main>

  <script src="app.js"></script>
</body>
</html>
